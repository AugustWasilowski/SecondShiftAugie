[project]
name = "second-shift-augie"
version = "2.0.0"
description = "Discord bot powered by Claude Code + Piper TTS, packaged as a single container."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "August Wasilowski" }]
dependencies = [
    "nextcord>=2.6.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "PyNaCl>=1.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voice"]
